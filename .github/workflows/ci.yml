name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r labs/lab-18-ci-cd/app/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check labs/lab-18-ci-cd/app

      - name: Run unit tests
        working-directory: labs/lab-18-ci-cd
        run: python -m unittest discover -s app -p 'test_*.py'
