name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.11","3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: labs/lab-18-ci-cd/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r labs/lab-18-ci-cd/app/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check labs/lab-18-ci-cd/app

      - name: Run unit tests
        working-directory: labs/lab-18-ci-cd
        run: |
          coverage run --source=app -m unittest discover -s app -p 'test_*.py'
          coverage report --fail-under=101
          coverage xml -o coverage.xml
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: labs/lab-18-ci-cd/coverage.xml

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: labs/lab-18-ci-cd
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:${{ github.sha }}