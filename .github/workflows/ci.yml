name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Rollback production to stable image"
        required: true
        type: boolean
        default: false

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.rollback == false
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.11","3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: labs/lab-18-ci-cd/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r labs/lab-18-ci-cd/app/requirements.txt
          pip install bandit

      - name: Lint with Ruff
        run: |
          ruff check labs/lab-18-ci-cd/app

      - name: Security check with Bandit
        run: |
          bandit -r labs/lab-18-ci-cd/app

      - name: Run tests with coverage
        working-directory: labs/lab-18-ci-cd
        run: |
          coverage run --source=app -m unittest discover -s app -p 'test_*.py'
          coverage report --fail-under=80
          coverage xml -o coverage.xml
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: labs/lab-18-ci-cd/coverage.xml

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: labs/lab-18-ci-cd
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:${{ github.sha }}
  
  deploy-staging:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Pull exact image
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:${{ github.sha }}
      
      - name: Run staging container
        run: |
          docker run -d \
            --name app-staging \
            -p 8080:8000 \
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Smoke test staging
        run: |
          curl --fail http://localhost:8080/health
      
      - name: Cleanup staging
        if: always()
        run: docker rm -f app-staging || true

  deploy-production:
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Pull exact image
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:${{ github.sha }}

      - name: Run production candidate
        run: |
          docker run -d \
            --name app-production \
            -p 8080:8000 \
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:${{ github.sha }}
           
      - name: Wait for application
        run: sleep 5

      - name: Smoke test production
        run: |
          curl --fail http://localhost:8080/health
      
      - name: Promote candidate to stable
        run: |
          docker tag \
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:${{ github.sha }} \
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:stable
          docker push \
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:stable

      - name: Cleanup production
        if: always()
        run: docker rm -f app-production || true
  rollback-production:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback == true
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Pull stable image
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:stable

      - name: Run rollback candidate
        run: |
          docker run -d \
            --name app-production \
            -p 8080:8000 \
            ${{ secrets.DOCKER_HUB_USERNAME }}/devops-lab18:stable

      - name: Wait for application
        run: sleep 5

      - name: Smoke test rollback
        run: |
          curl --fail http://localhost:8080/health

      - name: Cleanup rollback
        if: always()
        run: docker rm -f app-production || true
