apiVersion: v1
kind: Pod

metadata:
  name: s39-secret-env

spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        echo DB_USER=$DB_USER
        echo DB_PASSWORD=$DB_PASSWORD
        sleep 3600

    env:
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: s39-app-secret
            key: DB_USER
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: s39-app-secret
            key: DB_PASSWORD
