apiVersion: v1
kind: Pod

metadata:
  name: s39-config-env

spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo APP_ENV=$APP_ENV && sleep 3600"]

      env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: s39-app-config
              key: APP_ENV
