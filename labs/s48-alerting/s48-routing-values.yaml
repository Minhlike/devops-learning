
# S48 — Routing, Grouping, Inhibition lab

alertmanager:
  config:
    route:
      receiver: default-receiver
      group_by:
        - session
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 3h

      routes:
        - receiver: s48-lab
          matchers:
            - 'session="s48"'

    receivers:
      - name: default-receiver
      - name: s48-lab

    inhibit_rules:
      - source_matchers:
          - 'alertname="S48ParentAlert"'
          - 'session="s48"'

        target_matchers:
          - 'alertname="S48TrainingAlert"'
          - 'session="s48"'

        equal:
          - session
