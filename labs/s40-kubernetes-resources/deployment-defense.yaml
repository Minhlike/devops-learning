apiVersion: apps/v1
kind: Deployment
metadata:
  name: s40-defense
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s40-defense
  template:
    metadata:
      labels:
        app: s40-defense
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
      nodeSelector:
        disk: ssd
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "special"
        effect: "NoSchedule"
