apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: s40-scaling-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: s40-scaling

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: CPU
        target:
          type: Utilization
          averageUtilization: 50
