
# S47 — Fluent Bit trên K3s

kind: DaemonSet

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 200m
    memory: 192Mi

config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/podinfo-*_staging_*.log
        Tag kube.*
        multiline.parser docker, cri
        Read_from_Head On
        Refresh_Interval 5
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host s47-loki.monitoring.svc.cluster.local
        Port 3100
        Labels job=s47-podinfo,namespace=staging
        Line_Format json
        Retry_Limit False
