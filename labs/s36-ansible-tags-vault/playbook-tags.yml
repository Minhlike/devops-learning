---
- name: Lab S36 Tags
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Chuan bi thu muc ung dung
      ansible.builtin.file:
        path: /tmp/s36-app
        state: directory
        mode: "0755"
      tags:
        - setup

    - name: Deploy phien ban ung dung
      ansible.builtin.copy:
        dest: /tmp/s36-app/version.txt
        content: "version=1.0\n"
        mode: "0644"
      tags:
        - deploy

    - name: Kiem tra phien ban
      ansible.builtin.command:
        cmd: cat /tmp/s36-app/version.txt
      register: version_check
      changed_when: false
      tags:
        - verify

    - name: Hien thi phien ban
      ansible.builtin.debug:
        var: version_check.stdout
      tags:
        - verify
