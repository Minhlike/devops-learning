apiVersion: apps/v1
kind: Deployment
metadata:
  name: s44-readiness
  namespace: s44
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s44-readiness
  template:
    metadata:
      labels:
        app: s44-readiness
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=S44 application is running"
            - "-listen=:5678"
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: s44-readiness
  namespace: s44
spec:
  selector:
    app: s44-readiness
  ports:
    - port: 80
      targetPort: 5678