apiVersion: v1
kind: Pod
metadata:
  name: s44-oom-demo
  namespace: s44
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: python:3.13-alpine
      command: ["python3", "-u", "-c"]
      args:
        - |
          print("S44: allocating memory", flush=True)
          data = bytearray(128 * 1024 * 1024)
          print("Allocation completed", flush=True)
      resources:
        requests:
          memory: "16Mi"
        limits:
          memory: "32Mi"