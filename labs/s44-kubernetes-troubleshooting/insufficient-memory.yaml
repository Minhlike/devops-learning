apiVersion: v1
kind: Pod
metadata:
  name: s44-insufficient-memory
  namespace: s44
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          memory: "100Gi"
        limits:
          memory: "100Gi"