apiVersion: apps/v1
kind: Deployment

metadata:
  name: s39-readiness

spec:
  replicas: 2

  selector:
    matchLabels:
      app: s39-readiness

  template:
    metadata:
      labels:
        app: s39-readiness

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 2
            periodSeconds: 5