apiVersion: v1
kind: Pod

metadata:
  name: s39-liveness

spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine

      livenessProbe:
        httpGet:
          path: /
          port: 80

        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3