apiVersion: v1
kind: Pod

metadata:
  name: s39-secret-volume

spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]

    volumeMounts:
      - name: secret-volume
        mountPath: /etc/secrets
        readOnly: true

  volumes:
    - name: secret-volume
      secret:
        secretName: s39-app-secret
        defaultMode: 0400