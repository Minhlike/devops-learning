apiVersion: v1
kind: Pod

metadata:
  name: s39-startup

spec:
  containers:
    - name: app
      image: busybox:1.36

      command:
        - sh
        - -c
        - |
          sleep 20
          mkdir -p /www
          echo "APP STARTED" > /www/index.html
          httpd -f -p 8080 -h /www

      startupProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 3
        failureThreshold: 10

      livenessProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 5
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 5
