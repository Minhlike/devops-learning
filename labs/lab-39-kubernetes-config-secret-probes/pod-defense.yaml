apiVersion: v1
kind: Pod
metadata:
  name: s39-defense
spec:
  containers:
    - name: busybox-app
      image: busybox:1.36
      # Khởi tạo thư mục web, đợi 10s, in biến APP_ENV ra file index.html và chạy httpd port 8080
      command:
        - /bin/sh
        - -c
        - |
          sleep 10
          mkdir -p /var/www
          echo "$APP_ENV" > /var/www/index.html
          httpd -f -p 8080 -h /var/www
      env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: s39-app-config
              key: APP_ENV
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
      # 1. Startup Probe: Kiểm tra TCP port 8080, cho phép tối đa 30 lần x 1s = 30s để app kịp qua 10s sleep
      startupProbe:
        tcpSocket:
          port: 8080
        failureThreshold: 30
        periodSeconds: 1
      # 2. Readiness Probe: HTTP GET vào / port 8080
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 1
        periodSeconds: 5
      # 3. Liveness Probe: Kiểm tra port 8080 (TCP hoặc HTTP đều được)
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 1
        periodSeconds: 10
  volumes:
    - name: secret-volume
      secret:
        secretName: s39-app-secret
        defaultMode: 0400 # Quyền read-only chặt chẽ (chỉ owner được đọc)