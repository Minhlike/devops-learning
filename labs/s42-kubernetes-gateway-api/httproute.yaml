apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s42-api-route
  namespace: s42
spec:
  parentRefs:
    - name: s42-gateway
  hostnames:
    - shop.s42.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: s42-api
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: s42-web
          port: 80