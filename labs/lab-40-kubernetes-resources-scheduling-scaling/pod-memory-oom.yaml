apiVersion: v1
kind: Pod

metadata:
  name: s40-memory-oom

spec:
  restartPolicy: Never

  containers:
    - name: app
      image: python:3.12-alpine

      command:
        - python
        - -c
        - |
          import time
          print("Allocating memory...")
          x = bytearray(128 * 1024 * 1024)
          time.sleep(3600)

      resources:
        requests:
          memory: "32Mi"
        limits:
          memory: "64Mi"