apiVersion: v1
kind: Pod

metadata:
  name: s40-toleration

spec:
  nodeSelector:
    disk: ssd

  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]

      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"

  tolerations:
    - key: workload
      operator: Equal
      value: special
      effect: NoSchedule