---
- name: Cau hinh may local
  hosts: local
  connection: local
  gather_facts: true

  vars_files:
    - vars.yml

  tasks:
    - name: Hien thi he dieu hanh
      ansible.builtin.debug:
        msg: "May nay dang chay {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

    - name: Xac nhan may Ubuntu
      ansible.builtin.debug:
        msg: "Task nay chi chay tren Ubuntu"
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Xac nhan may Amazon Linux
      ansible.builtin.debug:
        msg: "Task nay chi chay tren Amazon Linux"
      when: ansible_facts['distribution'] == "Amazon"

    - name: Cai dat Nginx tren Ubuntu
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      become: true
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Dam bao Nginx dang chay va tu khoi dong
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      become: true

    - name: Render cau hinh Nginx tam thoi
      ansible.builtin.template:
        src: templates/nginx-demo.conf.j2
        dest: /tmp/ansible-nginx-demo.conf
        mode: "0644"

    - name: Tao file kiem tra Nginx tam thoi
      ansible.builtin.copy:
        dest: /tmp/ansible-nginx-test.conf
        mode: "0644"
        content: |
          events {}

          http {
            include /etc/nginx/mime.types;
            include /tmp/ansible-nginx-demo.conf;
          }

    - name: Kiem tra cau hinh Nginx truoc khi trien khai
      ansible.builtin.command:
        cmd: nginx -t -c /tmp/ansible-nginx-test.conf
      become: true
      changed_when: false

    - name: Trien khai cau hinh Nginx da kiem tra
      ansible.builtin.copy:
        src: /tmp/ansible-nginx-demo.conf
        dest: /etc/nginx/conf.d/ansible-demo.conf
        remote_src: true
        mode: "0644"
      become: true
      notify: Reload Nginx

    - name: Ap dung cau hinh Nginx ngay lap tuc
      ansible.builtin.meta: flush_handlers


    - name: Kiem tra trang thai Nginx
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_status
      changed_when: false

    - name: Kiem tra HTTP status cua ung dung
      ansible.builtin.command:
        cmd: curl -s -o /dev/null -w "%{http_code}" http://localhost:{{ app_port}}
      register: http_check
      changed_when: false
      failed_when: http_check.stdout != "200"

    - name: Hien thi HTTP status
      ansible.builtin.debug:
        msg: "HTTP status hien tai: {{ http_check.stdout }}"

    - name: Hien thi trang thai Nginx
      ansible.builtin.debug:
        msg: "Trang thai Nginx hien tai: {{ nginx_status.stdout }}"

    - name: Xac nhan Nginx dang hoat dong
      ansible.builtin.debug:
        msg: "Nginx dang hoat dong binh thuong."
      when: nginx_status.stdout == "active"

    - name: Tao file thong tin ung dung
      ansible.builtin.template:
        src: templates/app.conf.j2
        dest: /tmp/ansible-demo.txt
        mode: "0644"
      notify: Cau hinh da thay doi

    - name: Thu nghiem xu ly loi
      block:
        - name: Gia lap mot lenh bi loi
          ansible.builtin.command:
            cmd: /bin/false
          changed_when: false

      rescue:
        - name: Xu ly khi block that bai
          ansible.builtin.debug:
            msg: "Da phat hien loi va chuyen sang rescue."

      always:
        - name: Cong viec luon duoc thuc hien
          ansible.builtin.debug:
            msg: "Always van chay du block thanh cong hay that bai."


  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: true

    - name: Cau hinh da thay doi
      ansible.builtin.debug:
        msg: "Handler da duoc kich hoat vi file cau hinh vua thay doi."
