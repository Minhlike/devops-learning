apiVersion: v1
kind: Service
metadata:
  name: s41-stateful-headless
spec:
  clusterIP: None
  selector:
    app: s41-stateful
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s41-stateful
spec:
  serviceName: s41-stateful-headless
  replicas: 1
  selector:
    matchLabels:
      app: s41-stateful
  template:
    metadata:
      labels:
        app: s41-stateful
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sleep", "86400"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
