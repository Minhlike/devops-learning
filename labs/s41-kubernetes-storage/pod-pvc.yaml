apiVersion: v1
kind: Pod
metadata:
  name: s41-persistent
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "86400"]
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: s41-data
